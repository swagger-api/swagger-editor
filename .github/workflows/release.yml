name: Release SwaggerEditor
on:
  workflow_dispatch:
    branches:
      - main

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: true
          ref: main

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Determine the next release version
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90  # v6.0.0
        with:
          semantic_version: v24.2.3
          dry_run: true
          extra_plugins: |
            @semantic-release/git
            @semantic-release/exec
        env:
          GITHUB_TOKEN: ${{ secrets.SWAGGER_BOT_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Nothing to release
        if: ${{ env.NEXT_RELEASE_VERSION == '' }}
        uses: actions/github-script@v9
        with:
          script: |
            core.setFailed('Nothing to release')

      - name: Install dependencies
        run: npm ci

      - name: Prepare for the Release
        env:
          VITE_VERSION: ${{ env.NEXT_RELEASE_VERSION }}
        run: |
          npm run lint
          npm run test
          npm run pw:install
          npm run pw:ci
          npm run build:bundle:esm
          npm run build:bundle:umd
          npm run build:definitions

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@b12c8f6015dc215fe37bc154d4ad456dd3833c90 # v6.0.0
        with:
          dry_run: false
          extra_plugins: |
            @semantic-release/git
        env:
          GITHUB_TOKEN: ${{ secrets.SWAGGER_BOT_GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Release failed
        if: ${{ steps.semantic.outputs.new_release_published == 'false' }}
        uses: actions/github-script@v9
        with:
          script: |
            core.setFailed('Release failed')

      - name: Release published
        run: |
          echo ${{ steps.semantic.outputs.new_release_version }}
          echo ${{ steps.semantic.outputs.new_release_major_version }}
          echo ${{ steps.semantic.outputs.new_release_minor_version }}
          echo ${{ steps.semantic.outputs.new_release_patch_version }}

      - name: Prepare released version for uploading
        shell: bash
        run: |
          echo ${{ steps.semantic.outputs.new_release_version }} > released-version.txt

      - name: Upload released version
        uses: actions/upload-artifact@v7
        with:
          name: released-version
          path: ./released-version.txt
          retention-days: 1
