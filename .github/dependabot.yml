# Do not modify this file.
# Dependabot configuration can only be changed in the default branch

version: 2
updates:
  ######################
  # SwaggerEditor #
  ######################

  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: daily
    target-branch: "main"
    labels:
      - "cat: dependencies"
      - "javascript"
    commit-message:
      prefix: "chore"
      include: "scope"
    open-pull-requests-limit: 3


  - package-ecosystem: "docker"
    # Look for a `Dockerfile` in the `root` directory
    target-branch: "main"
    directory: "/"
    # Check for updates once a week
    schedule:
      interval: "weekly"
    labels:
      - "cat: dependencies"
      - "cat: docker"
      - "docker"

  - package-ecosystem: "github-actions"
    target-branch: "main"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "cat: dependencies"
      - "github_actions"
